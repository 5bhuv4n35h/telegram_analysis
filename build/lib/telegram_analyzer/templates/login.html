<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Telegram Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/main.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <a href="/" style="text-decoration: none; color: var(--primary); display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
                    <i class="fab fa-telegram" style="font-size: 2rem;"></i>
                    <span style="font-weight: 800; font-size: 1.2rem;">Telegram Analyzer</span>
                </a>
                <h2>Welcome Back</h2>
                <p>Sign in to continue your analysis.</p>
            </div>
            
            {% if error %}
                <div class="alert-error" style="background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 12px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255, 71, 87, 0.2);">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember" style="margin-bottom: 0;">Remember me</label>
                </div>
                <button type="submit" class="btn-premium" style="width: 100%; margin-top: 24px;">Login <i class="fas fa-sign-in-alt"></i></button>
            </form>
            
            <div style="margin-top: 32px; text-align: center; color: var(--text-muted);">
                Don't have an account? <a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a>
            </div>
        </div>
    </div>
</body>
</html>
