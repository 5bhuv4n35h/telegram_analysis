<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing | Telegram Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static_files', filename='css/main.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        .loader-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .progress-wrapper {
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            margin: 40px 0;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.5s ease;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .processing-steps {
            text-align: left;
            margin-top: 40px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }
        .step.active {
            color: var(--text-main);
        }
        .step i {
            width: 24px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="loader-container fade-in">
            <div class="pulse">
                <i class="fab fa-telegram" style="font-size: 5rem; color: var(--primary);"></i>
            </div>
            <h2 style="margin-top: 24px;">Analyzing Intelligence</h2>
            <p id="status-text" style="color: var(--text-muted);">Initializing neural engines...</p>

            <div class="progress-wrapper">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div class="processing-steps">
                <div class="step active" id="step-1">
                    <i class="fas fa-file-import"></i>
                    <span>Parsing JSON structure</span>
                </div>
                <div class="step" id="step-2">
                    <i class="fas fa-chart-line"></i>
                    <span>Calculating activity metrics</span>
                </div>
                <div class="step" id="step-3">
                    <i class="fas fa-brain"></i>
                    <span>Running sentiment analysis</span>
                </div>
                <div class="step" id="step-4">
                    <i class="fas fa-file-signature"></i>
                    <span>Generating interactive report</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateProgress() {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    const bar = document.getElementById('progress-bar');
                    const statusText = document.getElementById('status-text');
                    const progress = data.progress || 0;
                    
                    bar.style.width = progress + '%';
                    
                    if (data.message) {
                        statusText.textContent = data.message;
                    }
                    
                    if (progress < 25) {
                        document.getElementById('step-1').classList.add('active');
                    } else if (progress < 50) {
                        document.getElementById('step-2').classList.add('active');
                    } else if (progress < 75) {
                        document.getElementById('step-3').classList.add('active');
                    } else {
                        document.getElementById('step-4').classList.add('active');
                    }

                    if (data.status === 'complete') {
                        window.location.href = data.redirect;
                    } else if (data.status === 'failed') {
                        window.location.href = '/';
                    } else {
                        setTimeout(updateProgress, 1000);
                    }
                });
        }
        
        setTimeout(updateProgress, 1000);
    </script>
</body>
</html>
